services:
  app:
    build: .
    container_name: cookieclicker_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dans le réseau Docker, l'hôte MySQL est le nom du service : "db" (pas localhost)
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      # Rechargement à chaud en développement : les modifs de code sont visibles sans rebuild
      - .:/var/www/html

  db:
    image: mysql:8.4
    container_name: cookieclicker_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cookieclicker_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  db_data:
